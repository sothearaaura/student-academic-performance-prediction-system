<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password · {{ app_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for("static", filename="css/style.css") }}">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h5 class="fw-bold mb-1">Set a new password</h5>
      <div class="text-muted mb-4" style="font-size:0.85rem;">Choose a new password. This reset link can only be used once.</div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input type="password" name="new_password" class="form-control" minlength="8" autocomplete="new-password" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <input type="password" name="confirm_password" class="form-control" minlength="8" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-brand w-100">Reset Password</button>
      </form>
      <div class="text-center mt-3">
        <a href="{{ url_for('auth.login') }}" style="font-size:0.85rem;">&larr; Back to login</a>
      </div>
    </div>
  </div>
</body>
</html>
