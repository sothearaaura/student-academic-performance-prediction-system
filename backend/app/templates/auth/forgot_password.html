<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password · {{ app_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h5 class="fw-bold mb-1">Reset your password</h5>
      <div class="text-muted mb-4" style="font-size:0.85rem;">
        Enter your username and the email on file to set a new password.
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} py-2">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input type="password" name="new_password" class="form-control" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-brand w-100">Update Password</button>
      </form>
      <div class="text-center mt-3">
        <a href="{{ url_for('auth.login') }}" style="font-size:0.85rem;">&larr; Back to login</a>
      </div>
    </div>
  </div>
</body>
</html>
